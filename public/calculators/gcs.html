<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#145b87"><title>Шкала комы Глазго (GCS) — MedPilot AI</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18324b;background:#f3f7fb}*{box-sizing:border-box}body{margin:0;padding:20px 14px 40px}.wrap{max-width:720px;margin:0 auto}.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;margin:0 0 18px;padding:8px 0;background:rgba(243,247,251,.96);backdrop-filter:blur(10px)}.back{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;width:auto;padding:0 13px;border-radius:13px;background:#fff;color:#145b87;text-decoration:none;font-size:15px;font-weight:750;white-space:nowrap;box-shadow:0 3px 12px #173b5b12}.back .back-arrow{font-size:23px;line-height:1}.brand{font-size:12px;letter-spacing:.12em;color:#66829a;font-weight:800}.page-title{font-size:25px;line-height:1.2;margin:2px 0 0;color:#153e63}.card{background:#fff;border:1px solid #e0e9f1;border-radius:20px;padding:22px;box-shadow:0 8px 28px #173b5b0c}h2{font-size:22px;margin:0 0 12px;color:#153e63}h3{font-size:17px;margin:20px 0 12px}p{line-height:1.55;color:#536a7e}label{display:block;margin:14px 0 7px;font-size:14px;font-weight:650;color:#29445f}input,select{width:100%;min-height:48px;padding:12px 13px;border:1px solid #d7e2ed;border-radius:12px;background:#fbfdff;color:#17243a;font:inherit;font-size:16px;margin-bottom:8px}button.send{width:100%;min-height:50px;margin-top:16px;padding:12px 16px;border:0;border-radius:13px;background:linear-gradient(120deg,#176b9d,#168b91);color:white;font:inherit;font-weight:750}.warning{padding:13px 15px;border-radius:12px;background:#fff8eb;color:#785b2d;font-size:13px}.status{font-size:13px;color:#70869a}@media(max-width:480px){body{padding:14px 10px 30px}.card{padding:17px}.page-title{font-size:22px}}
</style><link rel="stylesheet" href="medical-theme.css?v=2"></head><body><main class="wrap"><header class="top"><a class="back" href="../index.html#clinical-tools" aria-label="Назад к списку калькуляторов"><span class="back-arrow" aria-hidden="true">‹</span><span>К списку калькуляторов</span></a><div><div class="brand">MEDPILOT AI · КАЛЬКУЛЯТОРЫ</div><h1 class="page-title">🧠 Шкала комы Глазго (GCS)</h1></div></header><section class="card" id="clinical-tools">
  <h2>🩺 Клинические калькуляторы</h2>
  <h3>Шкала комы Глазго (GCS)</h3>

  <label>Открывание глаз (E)</label>
  <select id="gcs-e">
    <option value="4">4 — Спонтанное</option>
    <option value="3">3 — На речь</option>
    <option value="2">2 — На боль</option>
    <option value="1">1 — Отсутствует</option>
  </select>

  <label>Речевая реакция (V)</label>
  <select id="gcs-v">
    <option value="5">5 — Ориентирован</option>
    <option value="4">4 — Спутанная речь</option>
    <option value="3">3 — Отдельные слова</option>
    <option value="2">2 — Нечленораздельные звуки</option>
    <option value="1">1 — Отсутствует</option>
    <option value="0">Невозможно оценить</option>
  </select>

  <label>Двигательная реакция (M)</label>
  <select id="gcs-m">
    <option value="6">6 — Выполняет команды</option>
    <option value="5">5 — Локализует боль</option>
    <option value="4">4 — Отдёргивает конечность</option>
    <option value="3">3 — Патологическое сгибание</option>
    <option value="2">2 — Разгибание</option>
    <option value="1">1 — Отсутствует</option>
    <option value="0">Невозможно оценить</option>
  </select>
  
  
  
  
  





  <button class="send" onclick="calculateGCS()">
    Рассчитать GCS
  </button>

  <div id="gcs-result" style="margin-top:15px;font-weight:700"></div>
   </div>
</section>

<script>
function calculateGCS() {
  const e = Number(document.getElementById("gcs-e").value);
  const v = Number(document.getElementById("gcs-v").value);
  const m = Number(document.getElementById("gcs-m").value);
  const result = document.getElementById("gcs-result");

  if (e === 0 || v === 0 || m === 0) {
    result.textContent =
      "Невозможно определить полный балл GCS: один или несколько компонентов не поддаются оценке. Укажите причину.";
    return;
  }

  const total = e + v + m;

  let severity = "";

  if (total <= 8) {
    severity = "Тяжёлое нарушение сознания";
  } else if (total <= 12) {
    severity = "Умеренное нарушение сознания";
  } else {
    severity = "Лёгкое нарушение сознания";
  }

  result.innerHTML =
    "GCS: " + total + "/15<br>" +
    "E: " + e + " | V: " + v + " | M: " + m +
    "<br>" + severity;
}
</script></main></body></html>
