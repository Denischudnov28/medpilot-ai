databases:
  - name: medflow-db
    plan: free
    region: oregon
    postgresMajorVersion: "18"

services:
  - type: web
    name: medpilot-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.5
      - key: DATABASE_URL
        fromDatabase:
          name: medflow-db
          property: connectionString
      - key: MEDFLOW_TOKEN_SECRET
        sync: false
