services:
  - type: web
    name: medpilot-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.5
      - key: DATABASE_URL
        sync: false
      - key: MEDFLOW_TOKEN_SECRET
        sync: false
